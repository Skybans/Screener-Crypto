name: Scan quotidien crypto

on:
  schedule:
    # 00:10 UTC chaque jour (a affiner plus tard selon l'heure de cloture reelle de chaque exchange)
    - cron: '10 0 * * *'
  workflow_dispatch:
    # Permet aussi de lancer le scan manuellement depuis l'onglet Actions sur GitHub

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les librairies
        run: pip install -r requirements.txt

      - name: Lancer le scan
        run: python -u run_scan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sauvegarder l'historique dans le depot
        run: |
          git config user.name "Crypto Scanner Bot"
          git config user.email "bot@users.noreply.github.com"
          git add resultats/ || true
          git commit -m "Scan du $(date +%Y-%m-%d)" || echo "Rien de nouveau a sauvegarder"
          git push
